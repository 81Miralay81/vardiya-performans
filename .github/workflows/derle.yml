name: Exe derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Testler
        run: python -m pytest -q tests
      - name: Exe derle
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name VardiyaPerformans `
            --icon assets/uygulama.ico --add-data "assets;assets" main.py
      - name: Exe kendini sınasın
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\VardiyaPerformans.exe -ArgumentList "--kendini-sina" -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) { throw "Exe kendini sınama başarısız: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: VardiyaPerformans
          path: dist/VardiyaPerformans.exe
      - name: Son sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guncel
          name: Son sürüm (${{ github.sha }})
          files: dist/VardiyaPerformans.exe
          prerelease: false
