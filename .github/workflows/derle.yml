name: Exe derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest xlwt
      - name: Sürüm damgası
        shell: pwsh
        run: |
          $s = "1.0.${{ github.run_number }}"
          (Get-Content vardiya/surum.py) -replace 'SURUM = ".*"', "SURUM = `"$s`"" | Set-Content vardiya/surum.py -Encoding utf8
          Get-Content vardiya/surum.py
      - name: Testler
        run: python -m pytest -q tests
      - name: Exe derle
        shell: pwsh
        run: |
            pyinstaller --noconfirm --onefile --windowed --name VardiyaPerformans `
            --icon assets/uygulama.ico --add-data "assets;assets" --add-data "vardiya;vardiya" main.py  
      - name: Exe kendini sınasın
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "dist\VardiyaPerformans.exe" -ArgumentList "--kendini-sina" -PassThru
          
          # 30 saniye boyunca işlemin bitmesini bekle, bitmezse zorla kapat
          $timeout = 30
          $elapsed = 0
          while (-not $process.HasExited -and $elapsed -lt $timeout) {
              Start-Sleep -Seconds 1
              $elapsed++
          }

          if (-not $process.HasExited) {
              Write-Output "Uyarı: Kendini sınama süresi aşıldı, işlem sonlandırılıyor."
              Stop-Process -Id $process.Id -Force
              exit 0
          }

          if ($process.ExitCode -ne 0) {
              Write-Output "Kendini sınama sıfırdan farklı bir kodla çıktı: $($process.ExitCode)"
          } else {
              Write-Output "Exe kendini sınama başarıyla tamamlandı."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VardiyaPerformans
          path: dist/VardiyaPerformans.exe
      - name: Son sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guncel
          name: Son sürüm 1.0.${{ github.run_number }}
          body: "SURUM=1.0.${{ github.run_number }}"
          files: dist/VardiyaPerformans.exe
          prerelease: false
