name: Exe derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest xlwt
      - name: Sürüm damgası
        shell: pwsh
        run: |
          $s = "1.0.${{ github.run_number }}"
          (Get-Content vardiya/surum.py) -replace 'SURUM = ".*"', "SURUM = `"$s`"" | Set-Content vardiya/surum.py -Encoding utf8
          Get-Content vardiya/surum.py
      - name: Testler
        run: python -m pytest -q tests
      - name: Exe derle
        shell: pwsh
        run: |
          $s = "1.0.${{ github.run_number }}"
          $v = "1, 0, ${{ github.run_number }}, 0"
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($v), prodvers=($v), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('041F04B0', [
                StringStruct('CompanyName', 'Teknorot'),
                StringStruct('FileDescription', 'Vardiya Performans'),
                StringStruct('FileVersion', '$s'),
                StringStruct('InternalName', 'VardiyaPerformans'),
                StringStruct('OriginalFilename', 'VardiyaPerformans.exe'),
                StringStruct('ProductName', 'Vardiya Performans'),
                StringStruct('ProductVersion', '$s')])]),
              VarFileInfo([VarStruct('Translation', [1055, 1200])])
            ]
          )
          "@ | Set-Content surum_bilgisi.txt -Encoding utf8
          # Tek dosya olarak derlenir. Tarayıcı motoru (web grafikleri) çıkarıldığı için dosya yine küçük ve açılış hızlı.
          pyinstaller --noconfirm --onefile --windowed --name VardiyaPerformans `
            --icon assets/uygulama.ico --version-file surum_bilgisi.txt --add-data "assets;assets" `
            --hidden-import win32timezone --hidden-import win32com.client main.py
      - name: Exe kendini sınasın
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\VardiyaPerformans.exe -ArgumentList "--kendini-sina" -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) { throw "Exe kendini sınama başarısız: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: VardiyaPerformans
          path: dist/VardiyaPerformans.exe
      # İkinci exe: web grafikli (ECharts). Aynı kod; web motoru eklenince grafikler web görünümüyle çizilir.
      - name: Web'li exe derle
        id: web
        continue-on-error: true
        shell: pwsh
        run: |
          pip install PySide6-Addons PySide6-WebEngine
          (Get-Content surum_bilgisi.txt) -replace "VardiyaPerformans.exe", "VardiyaPerformans_Web.exe" -replace "'Vardiya Performans'", "'Vardiya Performans (web grafikli)'" | Set-Content surum_bilgisi_web.txt -Encoding utf8
          pyinstaller --noconfirm --onefile --windowed --name VardiyaPerformans_Web `
            --icon assets/uygulama.ico --version-file surum_bilgisi_web.txt --add-data "assets;assets" `
            --hidden-import win32timezone --hidden-import win32com.client `
            --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebEngineCore main.py
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu"
          $p = Start-Process -FilePath dist\VardiyaPerformans_Web.exe -ArgumentList "--kendini-sina" -Wait -PassThru -RedirectStandardOutput wout.txt -RedirectStandardError werr.txt
          Get-Content wout.txt, werr.txt
          if ($p.ExitCode -ne 0) { throw "Web'li exe kendini sınama başarısız: $($p.ExitCode)" }
          if (-not (Select-String -Path wout.txt -Pattern "WEB TAMAM" -Quiet)) { throw "Web motoru exe'de çalışmadı" }
      - uses: actions/upload-artifact@v4
        if: steps.web.outcome == 'success'
        with:
          name: VardiyaPerformans_Web
          path: dist/VardiyaPerformans_Web.exe
      - name: Son sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guncel
          name: Son sürüm 1.0.${{ github.run_number }}
          body: "SURUM=1.0.${{ github.run_number }}"
          files: |
            dist/VardiyaPerformans.exe
            dist/VardiyaPerformans_Web.exe
          fail_on_unmatched_files: false
          prerelease: false
